name: Debug search probe (temporary)
on:
  push:
    branches: [claude/eager-allen-gvz5as]
    paths: ['.github/workflows/debug_search_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Query production search API
        run: |
          API=https://football-recruitment-engine-production.up.railway.app
          for P in "Holding midfielder with low fouls committed and strong interceptions per 90" \
                   "Holding midfielder with strong interceptions per 90" \
                   "defensive midfielder"; do
            echo "=================== $P"
            curl -sS -m 120 -X POST "$API/api/search" -H 'Content-Type: application/json' \
              -d "{\"prompt\": \"$P\", \"min_minutes\": 450, \"weight_performance\": 50, \"weight_tactical_fit\": 25, \"weight_market_efficiency\": 25, \"position\": \"CDM\", \"exclude_injured\": false, \"offset\": 0}" \
              -o r.json -w "HTTP %{http_code}\n"
            python3 - <<'PY'
          import json
          r = json.load(open("r.json"))
          if not isinstance(r, dict): print(str(r)[:800]); raise SystemExit
          print("total_found:", r.get("total_found"), "returned:", len(r.get("players") or []), "message:", r.get("message"))
          print("relaxed:", r.get("relaxed_filters"))
          print("interpretation:", json.dumps(r.get("query_interpretation"), indent=1)[:3000])
          for p in (r.get("players") or [])[:5]:
              print(" -", p.get("name"), "|", p.get("position"), "|", p.get("detailed_position"), "|", p.get("league_name"))
          PY
          done

name: Debug search probe (temporary)
on:
  push:
    branches: [claude/eager-allen-gvz5as]
    paths: ['.github/workflows/debug_search_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request
          API = "https://football-recruitment-engine-production.up.railway.app"
          def s(p):
              req = urllib.request.Request(API + "/api/search", data=json.dumps({"prompt": p, "min_minutes": 450, "offset": 0}).encode(), headers={"Content-Type": "application/json"})
              try:
                  return json.load(urllib.request.urlopen(req, timeout=180))
              except Exception as e:
                  print("   error:", e); return {}
          time.sleep(150)
          for i in range(40):
              r = s("Creative #10 in Italian Serie A with high chance creation and dribble success rate")
              if (r.get("total_found") or 0) > 0: break
              print("not live yet", i); time.sleep(30)
          for p in ["Creative #10 in Italian Serie A with high chance creation and dribble success rate", "striker in Premier League", "centre back in Bundesliga", "winger in La Liga", "striker who scores goals", "Holding midfielder with low fouls committed and strong interceptions per 90"]:
              r = s(p); from collections import Counter
              print("==", p, "| total", r.get("total_found"), "| msg", r.get("message"))
              print("   top:", [(x["name"], x["league_name"]) for x in (r.get("players") or [])[:3]])
              print("   leagues:", Counter(x["league_name"] for x in r.get("players") or []).most_common(6))
          PY

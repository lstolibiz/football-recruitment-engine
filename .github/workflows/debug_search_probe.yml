name: Debug search probe (temporary)
on:
  push:
    branches: [claude/eager-allen-gvz5as]
    paths: ['.github/workflows/debug_search_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          python3 -u - <<'PY'
          import json, time, urllib.request
          from collections import Counter
          API = "https://football-recruitment-engine-production.up.railway.app"
          def s(p):
              t = time.time()
              req = urllib.request.Request(API + "/api/search", data=json.dumps({"prompt": p, "min_minutes": 450, "offset": 0}).encode(), headers={"Content-Type": "application/json"})
              try:
                  r = json.load(urllib.request.urlopen(req, timeout=120))
              except Exception as e:
                  print("   error after", round(time.time() - t), "s:", e); return {}
              print("   (", round(time.time() - t), "s )"); return r
          print("health:", urllib.request.urlopen(API + "/api/health", timeout=60).read()[:200])
          for p in ["Creative #10 in Italian Serie A with high chance creation and dribble success rate", "striker in Premier League", "striker in Serie A", "striker who scores goals"]:
              r = s(p)
              print("==", p, "| total", r.get("total_found"), "| msg", r.get("message"))
              print("   top:", [(x["name"], x["league_name"]) for x in (r.get("players") or [])[:3]])
              print("   leagues:", Counter(x["league_name"] for x in r.get("players") or []).most_common(6))
          PY

name: Debug search probe (temporary)
on:
  push:
    branches: [claude/eager-allen-gvz5as]
    paths: ['.github/workflows/debug_search_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          API=https://football-recruitment-engine-production.up.railway.app
          for P in "Creative #10 in Italian Serie A with high chance creation and dribble success rate" \
                   "Creative #10 in Serie A" "attacking midfielder in Italian Serie A" "attacking midfielder in Serie A (Italy)"; do
            echo "=================== $P"
            python3 - "$P" <<'PY'
          import json, sys, urllib.request
          p = sys.argv[1]
          req = urllib.request.Request("https://football-recruitment-engine-production.up.railway.app/api/search",
              data=json.dumps({"prompt": p, "min_minutes": 450, "position": "CAM", "exclude_injured": False, "offset": 0}).encode(),
              headers={"Content-Type": "application/json"})
          r = json.load(urllib.request.urlopen(req, timeout=180))
          q = r.get("query_interpretation") or {}
          print("total_found", r.get("total_found"), "| message", r.get("message"), "| relaxed", r.get("relaxed_filters"))
          print(json.dumps({k: q.get(k) for k in ("position_group","detailed_position","archetypes","leagues","nationalities","stat_filters","keyword_boosts","keywords_detected","max_market_value","age_min","age_max","unsupported_metrics")}, ensure_ascii=False))
          for x in (r.get("players") or [])[:3]: print(" -", x["name"], "|", x.get("detailed_position"), "|", x["league_name"])
          PY
          done

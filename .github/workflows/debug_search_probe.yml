name: Debug search probe (temporary)
on:
  push:
    branches: [claude/eager-allen-gvz5as]
    paths: ['.github/workflows/debug_search_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          API = "https://football-recruitment-engine-production.up.railway.app"
          for p, mm in [("striker in Serie A", 0), ("striker in Serie A", 200), ("striker in Serie A", 450), ("striker in Premier League", 450), ("striker in Bundesliga", 450), ("striker in La Liga", 450), ("striker in Ligue 1", 450), ("striker in Eredivisie", 450)]:
              req = urllib.request.Request(API + "/api/search", data=json.dumps({"prompt": p, "min_minutes": mm, "offset": 0}).encode(), headers={"Content-Type": "application/json"})
              r = json.load(urllib.request.urlopen(req, timeout=180))
              pl = r.get("players") or []
              mins = sorted((x.get("stats") or {}).get("minutes_played") or 0 for x in pl)
              print(f"== {p} | min_minutes={mm} | total {r.get('total_found')} | leagues {(r.get('query_interpretation') or {}).get('leagues')} | minutes of results: min {mins[0] if mins else None} max {mins[-1] if mins else None}")
          PY

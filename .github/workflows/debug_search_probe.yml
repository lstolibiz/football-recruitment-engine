name: Debug search probe (temporary)
on:
  push:
    branches: [claude/eager-allen-gvz5as]
    paths: ['.github/workflows/debug_search_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - run: |
          python3 -u - <<'PY'
          import json, urllib.request
          API = "https://football-recruitment-engine-production.up.railway.app"
          def s(p, mm):
              req = urllib.request.Request(API + "/api/search", data=json.dumps({"prompt": p, "min_minutes": mm, "offset": 0}).encode(), headers={"Content-Type": "application/json"})
              try: return json.load(urllib.request.urlopen(req, timeout=120))
              except Exception as e: return {"err": str(e)}
          for lg in ["Premier League", "Bundesliga", "La Liga", "Serie A", "Ligue 1", "Eredivisie", "Liga Portugal", "Championship", "Major League Soccer"]:
              row = []
              for pos in ["striker", "central midfielder", "centre back", "goalkeeper"]:
                  r = s(f"{pos} in {lg}", 0)
                  pl = r.get("players") or []
                  mx = max([((x.get("stats") or {}).get("minutes_played") or 0) for x in pl] or [0])
                  row.append(f"{pos}: {r.get('total_found')} (max {mx:.0f} min)")
              print(f"{lg:22s} | " + " | ".join(row))
          PY

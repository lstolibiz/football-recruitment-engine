name: Debug search probe (temporary)
on:
  push:
    branches: [claude/eager-allen-gvz5as]
    paths: ['.github/workflows/debug_search_probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: |
          python3 -u - <<'PY'
          import json, urllib.request
          from collections import Counter
          API = "https://football-recruitment-engine-production.up.railway.app"
          def s(p):
              req = urllib.request.Request(API + "/api/search", data=json.dumps({"prompt": p, "min_minutes": 0, "offset": 0}).encode(), headers={"Content-Type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=120))
          for p in ["goalkeeper in Premier League", "defender in Premier League", "midfielder in Premier League", "forward in Premier League", "goalkeeper in Eredivisie", "defender in Major League Soccer"]:
              r = s(p); pl = r.get("players") or []
              print("==", p, "| total", r.get("total_found"))
              print("   (position, detailed):", Counter((x.get("position"), x.get("detailed_position")) for x in pl).most_common(10))
              print("   sample:", [(x["name"], x.get("detailed_position"), x["team_name"]) for x in pl[:6]])
          PY
